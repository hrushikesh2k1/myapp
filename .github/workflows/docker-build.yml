name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - 'feature/**'  # Optional: also build for feature branches

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Python for tests
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 3️⃣ Run Django tests
      - name: Run Django Tests
        run: python manage.py test

      # 4️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}   # Use token, not password

      # 5️⃣ Set up Docker Buildx (for multi-arch builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6️⃣ Determine image tags
      - name: Set image tags
        run: |
          echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          echo "COMMIT_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      # 7️⃣ Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/myapp:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/myapp:${{ env.COMMIT_TAG }}
